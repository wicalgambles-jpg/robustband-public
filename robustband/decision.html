<style>

/* 1.0 workspace: clear stages, restrained surfaces, accessible controls. */
body{background:radial-gradient(ellipse at 12% 0%,#e7f2ed 0,transparent 46%),#f6f8f7}

</style></head><body>
<nav><strong>robustband</strong><span class="tag" data-zh="版本采用检查" data-en="Adoption check"></span><a id="back" data-zh="返回评分比较" data-en="Back to comparison"></a><a id="ranking" data-zh="排名审计" data-en="Ranking audit"></a><button id="language">English</button><button id="stopSession" data-zh="结束本地会话" data-en="Stop session"></button></nav>
<main>
<h1 data-zh="这次改进，是否满足你的采用条件？" data-en="Does this change meet your adoption criteria?"></h1>
<p class="muted" data-zh="分别检查主要收益和关键指标退步上限，保留每项目标的规则、原因与证据。" data-en="Check the primary benefit and limits on key regressions. Keep each target’s rules, reasons and evidence."></p>
<div class="row actions"><button id="example" class="primary" data-zh="运行合成示例" data-en="Run synthetic example"></button><button id="template" data-zh="下载配对数据模板" data-en="Download paired template"></button><button id="newData" data-zh="使用自己的数据" data-en="Use my own data"></button></div>
<p class="muted" data-zh="本地处理 · 条件由你声明 · 规则范围不是置信区间" data-en="Local processing · Explicit criteria · Rule ranges are not confidence intervals"></p>
<div id="error" class="error" role="alert" tabindex="-1" hidden></div>
<section id="inputSection"><details id="inputDetails" open><summary class="stage-summary" id="inputSummary" data-zh="01 / 导入与核对数据" data-en="01 / Import and check data"></summary><h2 data-zh="1. 导入两版结果" data-en="1. Import paired results"></h2>
<div class="grid"><label><span data-zh="数据类型" data-en="Data kind"></span><select id="domain"></select></label><label><span data-zh="文件格式" data-en="File format"></span><select id="format"><option value="csv">CSV</option><option value="jsonl">JSONL</option></select></label></div>
<div id="drop"><label><span data-zh="每条记录的 A 和 B 应来自同一样本、同一实验条件。" data-en="A and B in each record must use the same sample and experimental conditions."></span><input id="file" type="file" accept=".csv,.jsonl,.ndjson"></label><p id="fileName" class="muted"></p><small data-zh="UTF-8；最多 4 MiB / 5,000 条指标记录。支持拖放文件。" data-en="UTF-8; up to 4 MiB / 5,000 measurement records. Drag and drop supported."></small></div>
<label id="layoutLabel"><span data-zh="数值文件结构" data-en="Numeric file layout"></span><select id="layout"><option value="canonical" data-zh="标准配对格式：sample_id, score_a, score_b, metric, unit, direction" data-en="Standard paired columns: sample_id, score_a, score_b, metric, unit, direction"></option><option value="wide" data-zh="自定义列名：手动指定 A/B 指标列" data-en="Custom columns: map A/B measurements"></option></select></label>
<div id="mapping" hidden><p class="notice" data-zh="明确指定列含义；每行已经包含配对结果。软件按原值读取，不自动转换单位或合并缺失样本。" data-en="Declare column meanings for an already paired row. Values are read as recorded, with no automatic unit conversion or missing-sample join."></p><div class="grid"><label><span data-zh="样本 ID 列" data-en="Sample ID column"></span><select id="idColumn"></select></label><label><span data-zh="分组列（可选）" data-en="Group column (optional)"></span><select id="groupColumn"></select></label></div><div id="metricMappings"></div><button id="addMetric" data-zh="增加指标映射" data-en="Add metric mapping"></button></div>
<button id="preview" class="primary actions" disabled data-zh="核对数据并设置条件" data-en="Check data and set criteria"></button><p id="message" class="muted" role="status"></p>
</details><div id="conversionActions" class="row actions" hidden><button id="exportData" data-zh="导出标准数据与转换清单" data-en="Export standard data and manifest"></button><small data-zh="精确值保留 · 转换后重新读取校验" data-en="Exact values retained · Reload checked"></small></div></section>
<section id="criteria" hidden><details id="criteriaDetails" open><summary class="stage-summary" id="criteriaSummary" data-zh="02 / 设置采用条件" data-en="02 / Set adoption criteria"></summary><h2 data-zh="2. 声明采用条件" data-en="2. Declare adoption criteria"></h2><p class="notice" data-zh="正的定向差值始终表示 A 更好。percent 指标的差值单位为百分点 pp；分割 IoU 的要求也使用 pp；文本正确率使用 0～1 的分数差。" data-en="Positive oriented margins always favor A. Percent metrics and segmentation IoU use percentage-point (pp) thresholds; text correctness uses score differences on a 0–1 scale."></p>
<div class="grid"><label><span data-zh="候选 A 名称" data-en="Candidate A"></span><input id="modelA" value="A"></label><label><span data-zh="基线 B 名称" data-en="Baseline B"></span><input id="modelB" value="B"></label></div>
<label><span data-zh="检查名称" data-en="Check name"></span><input id="planName" value="Candidate adoption"></label><label><span data-zh="采用依据：为什么选择这些目标和允许的规则？" data-en="Rationale: why these targets and admissible rules?"></span><textarea id="rationale" rows="2"></textarea></label>
<div id="targets"></div><button id="addTarget" data-zh="增加类别保护目标" data-en="Add a class guardrail" hidden></button>
<div class="row actions"><button id="savePlan" data-zh="保存条件文件" data-en="Save criteria file"></button><label><span data-zh="载入条件文件" data-en="Load criteria file"></span><input id="planFile" type="file" accept=".json"></label></div><p class="muted" data-zh="可在计算前保存条件并纳入版本控制。文件哈希记录内容；保存本身不证明预注册。修改数据或条件后，旧结果会失效。" data-en="Save and version criteria before calculating. The hash identifies contents; saving alone does not prove preregistration. Data or criteria changes invalidate the displayed result."></p>
<button id="run" class="primary" data-zh="检查采用条件" data-en="Check adoption criteria"></button>
</details></section>
<section id="result" hidden aria-live="polite"><span id="source" class="tag"></span><h2 id="status" class="status" tabindex="-1"></h2><p id="finding" class="notice"></p><p id="cohort" class="muted"></p><div id="summary" class="scroll"></div><div id="evidence"></div><div class="row actions"><button id="html" data-zh="保存可读报告" data-en="Save readable report"></button><button id="json" data-zh="保存完整复核数据" data-en="Save full replay data"></button></div><p class="muted" data-zh="完整复核 JSON 包含原始输入文件和列映射；分享前请核对内容。每项目标独立报告，不合成为跨单位总分。" data-en="Replay JSON includes the complete source file and mapping; review it before sharing. Targets stay separate without a combined cross-unit score."></p><details><summary data-zh="条件与复核命令" data-en="Criteria and replay command"></summary><p><code>python -m robustband verify report.json</code></p><p id="hash"></p><pre id="planText"></pre></details></section>
</main><script>
const $=id=>document.getElementById(id), token=location.hash.slice(1);
let lang=navigator.language.startsWith('zh')?'zh':'en', options, text='', mapping=null, loaded=null, last=null, demo=false, busy=false, revision=0, mappingSerial=0;
const phrases=new Map();const tr=(zh,en)=>{const pair={zh,en};phrases.set(zh,pair);phrases.set(en,pair);return lang==='zh'?zh:en;};
function translate(){
if(options){for(const d of options.domains){for(const pair of [d.title,...d.controls.flatMap(c=>[c.title,...(c.options||[]).map(o=>o.title)])]){phrases.set(pair.zh,pair);phrases.set(pair.en,pair);}}}
phrases.set('higher',{zh:'越高越好',en:'Higher is better'});phrases.set('lower',{zh:'越低越好',en:'Lower is better'});
document.querySelectorAll('#domain option,#mapping label,#mapping label span,#mapping button,#mapping option,#targets label,#targets label span,#targets p,#targets option,#message').forEach(e=>{for(const node of e.childNodes){if(node.nodeType===3&&phrases.has(node.textContent))node.textContent=phrases.get(node.textContent)[lang];}});
document.documentElement.lang=lang;document.querySelectorAll('[data-zh]').forEach(e=>e.textContent=e.dataset[lang]);$('language').textContent=tr('English','中文');if(last)render(last);}
function error(message=''){$('error').hidden=!message;const hint=/same sample IDs|duplicate.*sample_id/.test(message)?tr('请核对重复或缺失的样本，以及各指标的分组。','Check duplicate or missing samples and grouping across metrics.'):/unit or direction/.test(message)?tr('输入单位或优化方向与保存的条件不同。请核对数据或明确修订条件。','Input units or direction differ from the saved criteria. Check the data or explicitly revise the criteria.'):tr('请核对列映射、目标、阈值和规则依据。可下载模板对照。','Check mapping, targets, thresholds and rule rationale. Compare your input with the template.');$('error').textContent=message?hint+' '+message:'';if(message)$('error').focus();}
function invalidate(){revision++;last=null;$('result').hidden=true;error();}
function setBusy(value){busy=value;document.querySelectorAll('button,input,select,textarea').forEach(e=>{if(e.id!=='language')e.disabled=value;});$('preview').disabled=value||!text;}
function clearInput(){$('inputDetails').open=true;$('criteriaDetails').open=true;$('conversionActions').hidden=true;text='';loaded=null;mapping=null;demo=false;$('criteria').hidden=true;$('file').value='';$('fileName').textContent='';$('message').textContent='';$('preview').disabled=true;$('mapping').hidden=true;invalidate();}
async function api(path,body){const response=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Robustband-Token':token},body:JSON.stringify(body)});const result=await response.json();if(!response.ok)throw Error(result.error);return result;}
function download(name,value,type='application/json;charset=utf-8'){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([value],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function opt(select,values,empty=false){select.replaceChildren();if(empty){const o=document.createElement('option');o.value='';o.textContent=tr('不分组','No grouping');select.append(o);}for(const value of values){const o=document.createElement('option');o.value=value;o.textContent=value;select.append(o);}}
function field(parent,title,id,value='',kind='input'){const label=document.createElement('label'),span=document.createElement('span'),e=document.createElement(kind);span.textContent=title;e.id=id;if(kind!=='select')e.value=value;label.append(span,e);parent.append(label);return e;}
function addMapping(columns,initial){const index=mappingSerial++,box=document.createElement('div');box.className='metric-map';box.dataset.index=index;const grid=document.createElement('div');grid.className='grid';box.append(grid);for(const [key,title,value] of [['metric',tr('指标名','Metric'),'metric_'+(index+1)],['score_a',tr('A 的列','A column'),''],['score_b',tr('B 的列','B column'),''],['unit',tr('原始单位（percent/ms 等）','Recorded unit (percent/ms etc.)'),'percent'],['direction',tr('越高／越低越好','Preferred direction'),'higher']]){const e=field(grid,title,'map-'+index+'-'+key,initial?.[key]??value,['score_a','score_b','direction'].includes(key)?'select':'input');e.dataset.key=key;if(e.tagName==='SELECT'){opt(e,key==='direction'?['higher','lower']:columns);e.value=initial?.[key]??(key==='direction'?'higher':columns[key==='score_a'?1:2]??columns[0]);}}const remove=document.createElement('button');remove.type='button';remove.textContent=tr('删除此映射','Remove mapping');remove.onclick=()=>{box.remove();loaded=null;$('criteria').hidden=true;invalidate();};box.append(remove);$('metricMappings').append(box);}
function currentMapping(){if($('domain').value!=='scores'||$('layout').value!=='wide')return null;return {sample_id:$('idColumn').value,group:$('groupColumn').value||null,metrics:[...$('metricMappings').children].map(box=>Object.fromEntries([...box.querySelectorAll('[data-key]')].map(e=>[e.dataset.key,e.value])))};}
async function columns(initial){if($('domain').value!=='scores'||$('layout').value!=='wide'){$('mapping').hidden=true;return;}const result=await api('/api/decision/columns',{text,format:$('format').value});$('mapping').hidden=false;opt($('idColumn'),result.columns);opt($('groupColumn'),result.columns,true);$('idColumn').value=initial?.sample_id??result.columns[0];$('groupColumn').value=initial?.group??'';$('metricMappings').replaceChildren();for(const metric of initial?.metrics??[null])addMapping(result.columns,metric);$('addMetric').onclick=()=>{if($('metricMappings').children.length<16){addMapping(result.columns);loaded=null;$('criteria').hidden=true;invalidate();}};}
async function loadFile(file){if(!file||busy)return;clearInput();setBusy(true);try{if(file.size>options.max_bytes)throw Error(tr('文件超过 4 MiB。','File exceeds 4 MiB.'));text=new TextDecoder('utf-8',{fatal:true}).decode(await file.arrayBuffer());$('fileName').textContent=file.name;$('format').value=/\.(jsonl|ndjson)$/i.test(file.name)?'jsonl':'csv';if($('domain').value==='segmentation')$('format').value='jsonl';await columns();$('preview').disabled=false;}catch(e){error(e.message);}finally{setBusy(false);}}
function checks(parent,values,selected,descriptions){const div=document.createElement('div');div.className='checks';for(const value of values){const label=document.createElement('label'),e=document.createElement('input');e.type='checkbox';e.value=value;e.checked=selected.includes(value);label.append(e,document.createTextNode(descriptions.find(o=>o.value===value).title[lang]??value));div.append(label);}parent.append(div);return div;}
function addTarget(target,measurement){const index=$('targets').children.length,box=document.createElement('div');box.className='target';box.dataset.id=target?.id??'target_'+index;box.dataset.metric=target?.metric??measurement?.metric??'';box.dataset.unit=target?.unit??measurement?.unit??'';box.dataset.direction=target?.direction??measurement?.direction??'';const include=document.createElement('label'),checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=true;checkbox.className='include';include.append(checkbox,document.createTextNode(tr('使用此条件','Include this criterion')));box.append(include);const grid=document.createElement('div');grid.className='grid';box.append(grid);const label=field(grid,tr('目标名称','Target label'),'target-'+index+'-label',target?.label??measurement?.metric??'Target');label.className='target-label';const role=field(grid,tr('用途（恰好一项主要目标）','Role (exactly one primary)'),'target-'+index+'-role','','select');role.className='role';opt(role,['primary','guardrail']);role.options[0].textContent=tr('主要目标','Primary target');role.options[1].textContent=tr('保护条件','Guardrail');role.value=target?.role??(index===0?'primary':'guardrail');const threshold=field(grid,tr('要求的定向差值','Required oriented margin'),'target-'+index+'-threshold',target?.threshold??'0');threshold.className='threshold';threshold.inputMode='decimal';const operator=field(grid,tr('边界规则','Boundary rule'),'target-'+index+'-operator','','select');operator.className='operator';opt(operator,['gt','ge']);operator.options[0].textContent=tr('严格大于 >','Strictly greater >');operator.options[1].textContent=tr('大于或等于 ≥','At least ≥');operator.value=target?.operator??(index===0?'gt':'ge');const d=$('domain').value;const family=target?.family??(d==='scores'?{aggregations:['mean','median']}:options.domains.find(x=>x.id===d).defaults);if(d==='segmentation'){const e=field(box,tr('类别编号：all 或逗号分隔（例如 7）','Class indices: all or comma-separated (e.g. 7)'),'target-'+index+'-classes',family.classes===null?'all':family.classes.join(','));e.className='classes';}
const descriptor=options.domains.find(x=>x.id===d);for(const c of descriptor.controls){if(c.kind==='classes')continue;const heading=document.createElement('p');heading.textContent=c.title[lang]??c.title.en;box.append(heading);let values=c.options.map(o=>o.value);const group=checks(box,values,family[c.key]??[],c.options);group.dataset.family=c.key;}
const reason=field(box,tr('选择这些规则的依据（必填）','Reason for these rules (required)'),'target-'+index+'-reason',target?.reason??'','textarea');reason.className='reason';if(measurement){const p=document.createElement('p');p.className='muted';p.textContent=measurement.metric+' · '+measurement.unit+' · '+measurement.direction+' · '+measurement.n_items+' '+tr('配对样本','paired samples');box.append(p);}$('targets').append(box);}
function makePlan(){const d=$('domain').value;return {schema:'robustband.decision_plan/v1',domain:d,name:$('planName').value,rationale:$('rationale').value,targets:[...$('targets').children].filter(box=>box.querySelector('.include').checked).map(box=>{const family=Object.fromEntries([...box.querySelectorAll('[data-family]')].map(e=>[e.dataset.family,[...e.querySelectorAll('input:checked')].map(x=>x.value)]));if(d==='segmentation'){const v=box.querySelector('.classes').value.trim();if(v!=='all'&&!/^\d+(\s*,\s*\d+)*$/.test(v))throw Error(tr('类别编号应为 all 或非负整数列表。','Use all or comma-separated nonnegative class indices.'));family.classes=v==='all'?null:v.split(',').map(Number);}const target={id:box.dataset.id,label:box.querySelector('.target-label').value,role:box.querySelector('.role').value,threshold:box.querySelector('.threshold').value,operator:box.querySelector('.operator').value,reason:box.querySelector('.reason').value,family};if(d==='scores'){target.metric=box.dataset.metric;target.unit=box.dataset.unit;target.direction=box.dataset.direction;}return target;})};}
async function preview(plan){loaded=null;invalidate();mapping=currentMapping();const result=await api('/api/decision/preview',{text,format:$('format').value,domain:$('domain').value,mapping});loaded=result;$('inputDetails').open=false;$('criteriaDetails').open=true;$('conversionActions').hidden=false;$('targets').replaceChildren();$('criteria').hidden=false;$('addTarget').hidden=$('domain').value!=='segmentation';$('planName').value=plan?.name??'Candidate adoption';$('rationale').value=plan?.rationale??'';if(plan)for(const target of plan.targets)addTarget(target,result.metrics?.find(m=>m.metric===target.metric));else if(result.metrics)for(const m of result.metrics)addTarget(null,m);else addTarget();$('message').textContent=tr('数据已读取。请检查目标、阈值、规则及其依据。','Data loaded. Review targets, thresholds, rules and rationale.');}
function table(headers,rows){const t=document.createElement('table'),head=document.createElement('tr');for(const v of headers){const th=document.createElement('th');th.textContent=v;head.append(th);}t.append(head);for(const row of rows){const tr=document.createElement('tr');for(const v of row){const td=document.createElement('td');td.textContent=String(v);tr.append(td);}t.append(tr);}const wrap=document.createElement('div');wrap.className='scroll';wrap.append(t);return wrap;}
const statusText=s=>({PASS:tr('所声明的条件均满足','All declared criteria met'),FAIL:tr('至少一项条件始终未满足','A criterion fails under every selected rule'),REVIEW:tr('条件是否满足取决于所选规则','Criteria depend on the selected rules')})[s];
function render(response){const r=response.report;$('result').hidden=false;$('status').textContent=statusText(r.result.status);$('source').textContent=demo?tr('合成示例','Synthetic example'):tr('你导入的数据','Your imported data');$('finding').textContent=r.result.target_tradeoff?tr('主要收益满足要求，但关键指标保护条件未满足。请明确这项取舍后再决定是否采用。','The primary benefit passes, but a key guardrail fails. Resolve this tradeoff before deciding to adopt.'):tr('每项条件分别检查全部所选规则；请查看下方端点与未达标规则。','Each criterion checks every selected rule; inspect endpoint and failing rules below.');$('cohort').textContent=r.result.n_items+' '+tr('个共同配对样本；不同目标分别显示，规则范围不是置信区间。','common paired samples; targets are separate and rule ranges are not confidence intervals.');$('summary').replaceChildren(table([tr('目标','Target'),tr('要求','Requirement'),tr('差值范围','Margin range'),tr('结果','Result')],r.targets.map((o,i)=>[r.plan.targets[i].label,(r.plan.targets[i].operator==='gt'?'> ':'≥ ')+r.plan.targets[i].threshold+' '+o.unit,'['+o.display_margin_band.join(', ')+'] '+o.unit,statusText(o.status)])));$('evidence').replaceChildren();for(const [i,o] of r.targets.entries()){const box=document.createElement('div'),heading=document.createElement('h3'),reason=document.createElement('p'),failure=document.createElement('p'),details=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('pre');heading.textContent=r.plan.targets[i].label;reason.textContent=r.plan.targets[i].reason;failure.textContent=tr('未达标规则：','Failing rules: ')+(o.failing_protocols.join(', ')||tr('无','none'));const witnesses=[o.audit.witnesses.minimum,o.audit.witnesses.maximum];box.append(heading,reason,table([tr('端点','Endpoint'),tr('规则','Rule'),tr('差值','Margin')],witnesses.map((c,j)=>[j===0?tr('最低','Minimum'):tr('最高','Maximum'),c.protocol,c.display_margin??c.margin])),failure);summary.textContent=tr('精确值、规则与诊断','Exact values, rules and diagnostics');pre.textContent=JSON.stringify({threshold:o.exact_threshold,slack_band:o.exact_slack_band,configurations:o.audit.configurations,warnings:o.audit.warnings,limits:o.audit.limits},null,2);details.append(summary,pre);box.append(details);$('evidence').append(box);}$('hash').textContent='Plan SHA256: '+r.plan_sha256;$('planText').textContent=JSON.stringify(r.plan,null,2);}
async function run(){invalidate();setBusy(true);$('run').disabled=true;const current=revision;try{const response=await api('/api/decision/audit',{text,format:$('format').value,mapping,plan:makePlan(),model_a:$('modelA').value,model_b:$('modelB').value});if(current===revision){last=response;render(response);$('criteriaDetails').open=false;$('status').focus();}}catch(e){error(e.message);}finally{setBusy(false);$('run').disabled=false;}}
async function guarded(fn){if(busy)return;setBusy(true);try{await fn();}catch(e){error(e.message);}finally{setBusy(false);}}
$('exportData').onclick=()=>guarded(async()=>{const value=await api('/api/convert',{text,domain:$('domain').value,format:$('format').value,output_format:'jsonl',mapping:currentMapping()});download('paired-standard.jsonl',value.text,'application/x-ndjson;charset=utf-8');download('paired-standard.manifest.json',JSON.stringify(value.manifest,null,2)+'\n');});
$('language').onclick=()=>{lang=lang==='zh'?'en':'zh';translate();};$('file').onchange=()=>loadFile($('file').files[0]);$('preview').onclick=()=>guarded(()=>preview());$('run').onclick=run;$('newData').onclick=()=>{clearInput();$('inputSection').scrollIntoView();$('file').focus();};$('domain').onchange=()=>{clearInput();$('layoutLabel').hidden=$('domain').value!=='scores';$('format').value=$('domain').value==='segmentation'?'jsonl':'csv';};$('layout').onchange=()=>guarded(async()=>{loaded=null;$('criteria').hidden=true;invalidate();if(text)await columns();});$('format').onchange=()=>guarded(async()=>{loaded=null;$('criteria').hidden=true;invalidate();if(text)await columns();});$('mapping').addEventListener('input',()=>{loaded=null;$('criteria').hidden=true;invalidate();});$('criteria').addEventListener('input',invalidate);$('addTarget').onclick=()=>{if($('targets').children.length<16){addTarget({id:'target_'+$('targets').children.length,label:'Class guardrail',role:'guardrail',threshold:'0',operator:'ge',reason:'',family:{classes:[0],aggregations:['pooled','image_mean'],empty_classes:['zero']}});invalidate();}};
$('savePlan').onclick=()=>guarded(async()=>{const plan=await api('/api/decision/plan',{plan:makePlan()});download('plan.json',JSON.stringify(plan,null,2)+'\n');});$('planFile').onchange=()=>guarded(async()=>{const file=$('planFile').files[0];if(!file)return;if(file.size>65536)throw Error('Plan file exceeds 64 KiB.');const plan=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(await file.arrayBuffer()));if(plan.domain!==$('domain').value||!Array.isArray(plan.targets))throw Error(tr('条件文件需要与当前数据类型一致。','The plan must match the selected data kind.'));await api('/api/decision/plan',{plan});await preview(plan);});
$('example').onclick=()=>guarded(async()=>{clearInput();const e=await api('/api/decision/example');$('modelA').value='A';$('modelB').value='B';text=e.text;demo=true;$('domain').value=e.plan.domain;$('layoutLabel').hidden=e.plan.domain!=='scores';$('format').value=e.format;$('layout').value=e.mapping?'wide':'canonical';$('fileName').textContent=tr('合成示例（用于演示）','Synthetic example (demonstration)');await columns(e.mapping);$('preview').disabled=false;await preview(e.plan);setBusy(false);await run();});$('template').onclick=()=>{const d=options.domains.find(d=>d.id===$('domain').value);download(d.id+'-paired-template.'+d.example_format,d.example,'text/plain;charset=utf-8');};$('html').onclick=()=>{if(last)download('report.html',last.html,'text/html;charset=utf-8');};$('json').onclick=()=>{if(last)download('report.json',last.json);};
for(const type of ['dragenter','dragover'])$('drop').addEventListener(type,e=>{e.preventDefault();$('drop').classList.add('over');});for(const type of ['dragleave','drop'])$('drop').addEventListener(type,e=>{e.preventDefault();$('drop').classList.remove('over');});$('drop').addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));
async function init(){translate();$('back').href='/#'+token;$('ranking').href='/matrix#'+token;try{options=await api('/api/options');for(const d of options.domains.filter(d=>['text','segmentation','scores'].includes(d.id))){const o=document.createElement('option');o.value=d.id;o.textContent=d.title[lang]??d.title.en;$('domain').append(o);}$('domain').value=options.edition==='professional'?'text':'scores';$('layoutLabel').hidden=$('domain').value!=='scores';translate();if(!token)throw Error(tr('请从启动窗口打开包含 # 会话标识的完整地址。','Open the complete launch URL including the session fragment after #.'));}catch(e){error(e.message);}}
init();

document.getElementById('stopSession').onclick=async()=>{try{await fetch('/api/stop',{method:'POST',headers:{'Content-Type':'application/json','X-Robustband-Token':token},body:'{}'});document.body.replaceChildren();const message=document.createElement('p');message.style.padding='36px';message.textContent=document.documentElement.lang==='zh'?'本地会话已结束，可以关闭此页面。':'Local session ended. You can close this page.';document.body.append(message);}catch(e){document.getElementById('stopSession').textContent='Session ended';}};
</script></body></html>
