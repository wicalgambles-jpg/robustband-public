[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "robustband"
version = "1.0.1"
description = "Audit benchmarking claims across declared scoring protocols with exact bands, witnesses and experimental review planning."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zengzhao Gao", email = "wicalgambles@gmail.com" }]
keywords = [
    "benchmark",
    "evaluation",
    "reproducibility",
    "robustness",
    "scoring",
    "identifiability",
]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
robustband = "robustband.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "coverage>=7"]

[project.urls]
Homepage = "https://github.com/wicalgambles-jpg/robustband-public"
Repository = "https://github.com/wicalgambles-jpg/robustband-public"
Issues = "https://github.com/wicalgambles-jpg/robustband-public/issues"

[tool.setuptools]
packages = ["robustband"]

[tool.setuptools.package-data]
robustband = ["ui.html", "decision.html", "matrix.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["robustband"]

[tool.coverage.report]
show_missing = true
